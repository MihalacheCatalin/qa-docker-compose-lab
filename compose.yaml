services:
  db:
    image: postgres:16-alpine
    container_name: postgres_qa
    environment:
      POSTGRES_USER: qa_user
      POSTGRES_PASSWORD: qa_pass
      POSTGRES_DB: qa_db
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - qa-network

  cache:
    image: redis:7-alpine
    container_name: redis_qa
    networks:
      - qa-network

  adminer:
    image: adminer:latest
    container_name: adminer_qa
    ports:
      - "8888:8080"
    networks:
      - qa-network
    depends_on:
      - db

volumes:
  db-data:

networks:
  qa-network:
    driver: bridge